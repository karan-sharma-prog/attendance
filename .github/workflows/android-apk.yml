name: Build SmartPresence Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Production HTTPS Backend API URL (e.g. https://your-app.vercel.app/api/v1)'
        required: false
        default: 'https://smartpresence.vercel.app/api/v1'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets & Sync Capacitor Android
        working-directory: frontend
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || secrets.VITE_API_URL || 'https://smartpresence.vercel.app/api/v1' }}
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartpresence-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
